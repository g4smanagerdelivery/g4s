<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>G4S Инкассационная доставка</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyBQpb3mSpomljZihoyOlj77a8F99Tm9IFc",
  authDomain: "auction-top7.firebaseapp.com",
  projectId: "auction-top7",
  storageBucket: "auction-top7.firebasestorage.app",
  messagingSenderId: "73096110012",
  appId: "1:73096110012:web:8f014f6faae5d08bd455b9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const userId = decodeURIComponent(params.get("user") || "");
const isAdminParam = params.get("admin") === "true";

const ADMIN_PASSWORD = "123456";
let isAdmin = false;
let endTime = null;

// ===== КАРТА И АНИМАЦИЯ =====
let map, routing, carMarker;
let routeCoords = [];
let carIndex = 0;
let carInterval = null;

if (isAdminParam) {
  const p = prompt("Пароль администратора");
  if (p === ADMIN_PASSWORD) isAdmin = true;
  else throw new Error("Access denied");
}

window.onload = () => {
  if (isAdmin) document.getElementById("admin").style.display = "block";

  initMap();

  if (userId) {
    const ref = doc(db, "investors", userId);

    onSnapshot(ref, (snap) => {
      if (!snap.exists()) {
        document.getElementById("fio").textContent = "Данные не найдены";
        return;
      }

      const d = snap.data();
      endTime = new Date(d.endTime);

      document.getElementById("fio").textContent = d.name;
      document.getElementById("fromCity").textContent = d.fromCity;
      document.getElementById("toCity").textContent = d.toCity;
      document.getElementById("infoBox").innerHTML =
        (d.info || "").replace(/\n/g, "<br>");

      buildRoute(d.fromCity, d.toCity);
    });
  }

  setInterval(updateTimer, 1000);
};

function updateTimer() {
  if (!endTime) return;
  const diff = Math.max(0, endTime - new Date());
  const h = Math.floor(diff / 36e5);
  const m = Math.floor(diff % 36e5 / 6e4);
  const s = Math.floor(diff % 6e4 / 1000);

  document.getElementById("time").textContent =
    `${h}ч ${m}м ${s}с`;
}

// ===== ИНИЦИАЛИЗАЦИЯ КАРТЫ (БЕЗ УКРАИНСКОГО ФЛАГА) =====
function initMap() {
  map = L.map("map").setView([48.0196, 66.9237], 6); // Казахстан

  // ✅ НОВАЯ КАРТА — Esri (чистая, нейтральная, без флага)
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
    {
      attribution: "Esri"
    }
  ).addTo(map);

  // Иконка машинки
  const carIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/744/744465.png",
    iconSize: [40, 40]
  });

  carMarker = L.marker([0, 0], { icon: carIcon }).addTo(map);
}

// ===== ПОСТРОЕНИЕ МАРШРУТА =====
function buildRoute(fromCity, toCity) {
  if (routing) {
    map.removeControl(routing);
  }

  routing = L.Routing.control({
    waypoints: [
      L.latLng(0, 0),
      L.latLng(0, 0)
    ],
    routeWhileDragging: false,
    createMarker: () => null,
    lineOptions: {
      styles: [{ color: "#007bff", weight: 5 }]
    },
    // стабильный бесплатный сервер маршрутизации
    router: L.Routing.osrmv1({
      serviceUrl: "https://routing.openstreetmap.de/routed-car/route/v1"
    })
  }).addTo(map);

  Promise.all([
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fromCity + ", Kazakhstan")}`)
      .then(r => r.json()),
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(toCity + ", Kazakhstan")}`)
      .then(r => r.json())
  ]).then(([fromData, toData]) => {
    if (!fromData[0] || !toData[0]) {
      alert("Не удалось найти один из городов на карте");
      return;
    }

    const from = L.latLng(fromData[0].lat, fromData[0].lon);
    const to = L.latLng(toData[0].lat, toData[0].lon);

    routing.setWaypoints([from, to]);

    routing.on("routesfound", function (e) {
      const route = e.routes[0];

      routeCoords = route.coordinates.map(c => [c.lat, c.lng]);

      carIndex = 0;
      carMarker.setLatLng(routeCoords[0]);
      map.fitBounds(route.getBounds());

      startCar();
    });
  });
}

// ===== АНИМАЦИЯ МАШИНЫ =====
function startCar() {
  if (carInterval) clearInterval(carInterval);

  carInterval = setInterval(() => {
    if (carIndex >= routeCoords.length) {
      clearInterval(carInterval);
      return;
    }

    const [lat, lng] = routeCoords[carIndex];
    carMarker.setLatLng([lat, lng]);

    carIndex++;
  }, 500);
}

// ===== СОХРАНЕНИЕ ИЗ АДМИНКИ =====
window.saveUser = async () => {
  try {
    const id = uid.value.trim();
    const name = uname.value.trim();
    const t = endInput.value;
    const info = uinfo.value.trim();
    const fromCity = fromCityInput.value.trim();
    const toCity = toCityInput.value.trim();

    if (!id || !name || !t || !fromCity || !toCity) {
      alert("Заполни все поля!");
      return;
    }

    await setDoc(doc(db, "investors", id), {
      name,
      endTime: new Date(t).toISOString(),
      info: info || "—",
      fromCity,
      toCity
    });

    const link =
      "https://g4smanagerdelivery.github.io/g4s/?user=" +
      encodeURIComponent(id);

    await navigator.clipboard.writeText(link);

    alert("Сохранено ✅\nСсылка скопирована:\n\n" + link);
  } catch (err) {
    console.error(err);
    alert("Ошибка — смотри F12 → Console");
  }
};
</script>

<style>
body { margin: 0; font-family: Arial; }

.container {
  display: flex;
  height: 100vh;
}

#panel {
  width: 40%;
  padding: 20px;
  background: #f2f2f2;
  overflow-y: auto;
}

#map {
  width: 60%;
  height: 100vh;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

#admin { display: none; margin-top: 20px; }
</style>
</head>

<body>

<div class="container">

  <div id="panel">
    <div class="card">
      <h1>ИНКАССАЦИОННАЯ ДОСТАВКА</h1>

      <h3>ФИО:</h3>
      <p id="fio">Загрузка…</p>

      <h3>Примерное время прибытия:</h3>
      <p id="time">--:--:--</p>

      <h3>Маршрут:</h3>
      <p><b>Откуда:</b> <span id="fromCity"></span></p>
      <p><b>Куда:</b> <span id="toCity"></span></p>

      <h3>Информация:</h3>
      <div id="infoBox"></div>
    </div>

    <div id="admin">
      <h2>Админ-панель</h2>

      <input id="uid" placeholder="ID (например: Tuman)">
      <input id="uname" placeholder="ФИО">
      <input type="datetime-local" id="endInput">

      <input id="fromCityInput" placeholder="Откуда (город)">
      <input id="toCityInput" placeholder="Куда (город)">

      <textarea id="uinfo" rows="5" placeholder="Информация"></textarea>

      <button onclick="saveUser()">Сохранить</button>
    </div>
  </div>

  <div id="map"></div>

</div>

</body>
</html>
