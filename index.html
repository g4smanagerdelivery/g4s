<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>G4S Доставка</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyBQpb3mSpomljZihoyOlj77a8F99Tm9IFc",
  authDomain: "auction-top7.firebaseapp.com",
  projectId: "auction-top7",
  storageBucket: "auction-top7.firebasestorage.app",
  messagingSenderId: "73096110012",
  appId: "1:73096110012:web:8f014f6faae5d08bd455b9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const userId = decodeURIComponent(params.get("user") || "");
const isAdminParam = params.get("admin") === "true";

const ADMIN_PASSWORD = "123456";
let isAdmin = false;

// ===== КАРТА / МАРШРУТ / МАШИНА =====
let map, carMarker, routingControl;
let routePoints = [];
let endTime = null;
let totalDurationMs = 0;

if (isAdminParam) {
  const p = prompt("Пароль администратора");
  if (p === ADMIN_PASSWORD) isAdmin = true;
  else throw new Error("Access denied");
}

window.onload = () => {
  if (isAdmin) document.getElementById("admin").style.display = "block";

  initMap();

  if (userId) {
    const ref = doc(db, "investors", userId);

    onSnapshot(ref, (snap) => {
      if (!snap.exists()) {
        document.getElementById("fio").textContent = "Данные не найдены";
        return;
      }

      const d = snap.data();
      endTime = new Date(d.endTime);
      totalDurationMs = Math.max(1000, endTime - new Date());

      document.getElementById("fio").textContent = d.name;
      document.getElementById("fromCity").textContent = d.fromCity;
      document.getElementById("toCity").textContent = d.toCity;
      document.getElementById("infoBox").innerHTML =
        (d.info || "").replace(/\n/g, "<br>");

      buildRouteOnRoads(
        [d.fromLat, d.fromLng],
        [d.toLat, d.toLng]
      );
    });
  }

  setInterval(updateTimerAndCar, 1000);
};

function updateTimerAndCar() {
  if (!endTime || routePoints.length === 0) return;

  const now = new Date();
  let diff = Math.max(0, endTime - now);

  const h = Math.floor(diff / 36e5);
  const m = Math.floor(diff % 36e5 / 6e4);
  const s = Math.floor(diff % 6e4 / 1000);

  document.getElementById("time").textContent =
    `${h}ч ${m}м ${s}с`;

  const passed = totalDurationMs - diff;
  const progress = Math.min(1, passed / totalDurationMs);
  const index = Math.floor(progress * (routePoints.length - 1));

  carMarker.setLatLng(routePoints[index]);
}

// ===== ИНИЦИАЛИЗАЦИЯ КАРТЫ =====
function initMap() {
  map = L.map("map").setView([48.0196, 66.9237], 6);

  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
    { attribution: "Esri" }
  ).addTo(map);

  const carIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/744/744465.png",
    iconSize: [40, 40]
  });

  carMarker = L.marker([0, 0], { icon: carIcon }).addTo(map);
}

// ===== МАРШРУТ ПО ДОРОГАМ (ПРАВИЛЬНО) =====
function buildRouteOnRoads(from, to) {
  if (routingControl) {
    map.removeControl(routingControl);
  }

  routingControl = L.Routing.control({
    waypoints: [
      L.latLng(from[0], from[1]),
      L.latLng(to[0], to[1])
    ],
    lineOptions: {
      styles: [{ color: "#007bff", weight: 5 }]
    },
    addWaypoints: false,
    draggableWaypoints: false,
    fitSelectedRoutes: true,
    show: false,

    router: L.Routing.osrmv1({
      serviceUrl: "https://routing.openstreetmap.de/routed-car/route/v1"
    })
  }).addTo(map);

  routingControl.on("routesfound", function(e) {
    const route = e.routes[0];
    routePoints = [];

    // ВАЖНО: берем ТОЧКИ именно с дорожного маршрута
    route.coordinates.forEach(coord => {
      routePoints.push([coord.lat, coord.lng]);
    });

    carMarker.setLatLng(routePoints[0]);
    map.fitBounds(route.getBounds());
  });
}

// ===== ГЕОКОДИНГ ТОЛЬКО В АДМИНКЕ =====
async function geocodeCity(city) {
  const url =
    "https://photon.komoot.io/api/?q=" +
    encodeURIComponent(city + ", Kazakhstan");

  const res = await fetch(url);
  const data = await res.json();

  if (data.features && data.features.length > 0) {
    const [lng, lat] = data.features[0].geometry.coordinates;
    return { lat, lng };
  } else {
    alert("Город не найден: " + city);
    throw new Error("Geocode failed");
  }
}

// ===== СОХРАНЕНИЕ ИЗ АДМИНКИ =====
window.saveUser = async () => {
  try {
    const id = uid.value.trim();
    const name = uname.value.trim();
    const t = endInput.value;
    const info = uinfo.value.trim();
    const fromCity = fromCityInput.value.trim();
    const toCity = toCityInput.value.trim();

    if (!id || !name || !t || !fromCity || !toCity) {
      alert("Заполни все поля!");
      return;
    }

    document.getElementById("status").textContent =
      "Ищу координаты городов...";

    const from = await geocodeCity(fromCity);
    const to = await geocodeCity(toCity);

    await setDoc(doc(db, "investors", id), {
      name,
      endTime: new Date(t).toISOString(),
      info: info || "—",
      fromCity,
      toCity,
      fromLat: from.lat,
      fromLng: from.lng,
      toLat: to.lat,
      toLng: to.lng
    });

    const link =
      "https://g4smanagerdelivery.github.io/g4s/?user=" +
      encodeURIComponent(id);

    await navigator.clipboard.writeText(link);

    document.getElementById("status").textContent =
      "Сохранено! Ссылка скопирована.";
    alert("Готово! Ссылка скопирована:\n\n" + link);
  } catch (err) {
    console.error(err);
    document.getElementById("status").textContent =
      "Ошибка — смотри F12 → Console";
  }
};
</script>

<style>
body { margin: 0; font-family: Arial; }

.container {
  display: flex;
  height: 100vh;
}

#panel {
  width: 40%;
  padding: 20px;
  background: #f2f2f2;
  overflow-y: auto;
}

#map {
  width: 60%;
  height: 100vh;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

#admin { display: none; margin-top: 20px; }
</style>
</head>

<body>

<div class="container">

  <div id="panel">
    <div class="card">
      <h1>ИНКАССАЦИОННАЯ ДОСТАВКА</h1>

      <h3>Получатель:</h3>
      <p id="fio">Загрузка…</p>

      <h3>Примерное время прибытия:</h3>
      <p id="time">--:--:--</p>

      <h3>Маршрут:</h3>
      <p><b>Откуда:</b> <span id="fromCity"></span></p>
      <p><b>Куда:</b> <span id="toCity"></span></p>

      <h3>Информация:</h3>
      <div id="infoBox"></div>
    </div>

    <div id="admin">
      <h2>Админ-панель</h2>

      <input id="uid" placeholder="ID (например: Tuman)">
      <input id="uname" placeholder="ФИО">
      <input type="datetime-local" id="endInput">

      <input id="fromCityInput" placeholder="Откуда (город)">
      <input id="toCityInput" placeholder="Куда (город)">

      <textarea id="uinfo" rows="5" placeholder="Информация"></textarea>

      <p id="status" style="color: green;"></p>

      <button onclick="saveUser()">Сохранить</button>
    </div>
  </div>

  <div id="map"></div>

</div>

</body>
</html>
