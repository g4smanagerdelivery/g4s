<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>G4S Инкассационная доставка</title>

<!-- Leaflet (карта) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet Routing Machine (маршрут по дорогам) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}

#container {
  display: flex;
  height: 100vh;
}

/* Левая часть — информация */
#info {
  width: 40%;
  padding: 20px;
  box-sizing: border-box;
  background: white;
  overflow-y: auto;
}

/* Правая часть — карта */
#map {
  width: 60%;
  height: 100vh;
}

/* Админка */
#admin {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #f7f7f7;
  border-radius: 8px;
}

#admin input, #admin textarea {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
}

/* Убираем лишние элементы Leaflet */
.leaflet-control-attribution,
.leaflet-routing-container {
  display: none !important;
}
</style>
</head>

<body>

<div id="container">

  <!-- ЛЕВАЯ ЧАСТЬ -->
  <div id="info">
    <h1>ИНКАССАЦИОННАЯ ДОСТАВКА</h1>

    <h3>Получатель:</h3>
    <p id="clientName">Загрузка…</p>

    <h3>Примерное время прибытия:</h3>
    <p id="eta">--:--:--</p>

    <h3>Маршрут:</h3>
    <p><b>Откуда:</b> <span id="fromCity"></span></p>
    <p><b>Куда:</b> <span id="toCity"></span></p>

    <h3>Информация:</h3>
    <p id="infoText"></p>

    <!-- АДМИН-ПАНЕЛЬ -->
    <div id="admin">
      <h2>Админ-панель</h2>

      <input id="uid" placeholder="ID клиента (например: Tuman)">
      <input id="uname" placeholder="ФИО">
      <input type="datetime-local" id="endInput">
      <input id="fromInput" placeholder="Откуда (город)">
      <input id="toInput" placeholder="Куда (город)">
      <textarea id="uinfo" rows="4" placeholder="Информация о доставке"></textarea>

      <button onclick="saveUser()">Сохранить</button>
    </div>
  </div>

  <!-- КАРТА -->
  <div id="map"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQpb3mSpomljZihoyOlj77a8F99Tm9IFc",
  authDomain: "auction-top7.firebaseapp.com",
  projectId: "auction-top7",
  storageBucket: "auction-top7.firebasestorage.app",
  messagingSenderId: "73096110012",
  appId: "1:73096110012:web:8f014f6faae5d08bd455b9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== ПАРАМЕТРЫ =====
const params = new URLSearchParams(location.search);
const userId = decodeURIComponent(params.get("user") || "");
const isAdmin = params.get("admin") === "true";

// ===== КАРТА =====
const map = L.map("map", {
  zoomControl: false,
  attributionControl: false
}).setView([48.0196, 66.9237], 5);

// Нейтральная бесплатная карта (без флагов)
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
  { attribution: "Esri" }
).addTo(map);

// ===== ИКОНКА МАШИНЫ =====
const carIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/684/684908.png",
  iconSize: [40, 40],
  iconAnchor: [20, 20]
});

let carMarker = L.marker([0, 0], { icon: carIcon });

// ===== УМНЫЙ ПОИСК ГОРОДА (работает для любых городов/посёлков) =====
async function geocodeCity(city) {
  const tries = [
    `${city}, Kazakhstan`,
    `${city}, KZ`,
    city
  ];

  for (let query of tries) {
    try {
      const url =
        "https://nominatim.openstreetmap.org/search?format=json&q=" +
        encodeURIComponent(query);

      const res = await fetch(url);
      const data = await res.json();

      if (data && data.length > 0) {
        return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      }
    } catch (e) {
      console.log("Не найден:", query);
    }
  }

  // Если вообще не найден — ставим центр Казахстана
  return [48.0196, 66.9237];
}

// ===== ЗАГРУЗКА ДАННЫХ ИЗ FIREBASE =====
if (userId) {
  const ref = doc(db, "investors", userId);

  onSnapshot(ref, async (snap) => {
    if (!snap.exists()) {
      alert("Клиент не найден");
      return;
    }

    const d = snap.data();

    document.getElementById("clientName").innerText = d.name;
    document.getElementById("fromCity").innerText = d.from;
    document.getElementById("toCity").innerText = d.to;
    document.getElementById("infoText").innerText = d.info || "—";

    const endTime = new Date(d.endTime);

    // Таймер
    setInterval(() => {
      const diff = Math.max(0, endTime - new Date());
      const h = Math.floor(diff / 36e5);
      const m = Math.floor(diff % 36e5 / 6e4);
      const s = Math.floor(diff % 6e4 / 1000);

      document.getElementById("eta").innerText =
        `${h}ч ${m}м ${s}с`;
    }, 1000);

    // Строим маршрут по дорогам
    const fromCoords = await geocodeCity(d.from);
    const toCoords = await geocodeCity(d.to);

    const routeControl = L.Routing.control({
      waypoints: [
        L.latLng(fromCoords[0], fromCoords[1]),
        L.latLng(toCoords[0], toCoords[1])
      ],
      router: L.Routing.osrmv1({
        serviceUrl: "https://router.project-osrm.org/route/v1"
      }),
      addWaypoints: false,
      draggableWaypoints: false,
      fitSelectedRoutes: true
    }).addTo(map);

    routeControl.on("routesfound", function(e) {
      const route = e.routes[0];
      const coords = route.coordinates;

      carMarker.setLatLng(coords[0]);
      carMarker.addTo(map);

      let startTime = Date.now();
      let totalMs = endTime - startTime;

      function animate() {
        let elapsed = Date.now() - startTime;
        let progress = elapsed / totalMs;

        if (progress > 1) progress = 1;

        let index = Math.floor(progress * (coords.length - 1));
        carMarker.setLatLng(coords[index]);

        if (progress < 1) {
          requestAnimationFrame(animate);
        }
      }

      animate();
    });
  });
}

// ===== АДМИНКА =====
if (isAdmin) {
  document.getElementById("admin").style.display = "block";
}

window.saveUser = async function() {
  const id = uid.value.trim();
  const name = uname.value.trim();
  const t = endInput.value;
  const from = fromInput.value.trim();
  const to = toInput.value.trim();
  const info = uinfo.value;

  if (!id || !name || !t || !from || !to) {
    alert("Заполни все поля");
    return;
  }

  await setDoc(doc(db, "investors", id), {
    name,
    from,
    to,
    endTime: new Date(t).toISOString(),
    info: info || "—"
  });

  const link =
    location.origin + location.pathname + "?user=" + encodeURIComponent(id);

  alert("Сохранено!\nСсылка для клиента:\n\n" + link);
};
</script>

</body>
</html>
