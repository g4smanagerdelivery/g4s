<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Трекер доставки</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

#container {
  display: flex;
  height: 100vh;
}

#info {
  width: 35%;
  padding: 20px;
  box-sizing: border-box;
  background: #f5f5f5;
}

#map {
  width: 65%;
  height: 100%;
}

/* Убираем панель маршрута справа */
.leaflet-routing-container {
  display: none !important;
}
</style>
</head>

<body>

<div id="container">
  <div id="info">
    <h2>ИНКАССАЦИОННАЯ ДОСТАВКА</h2>

    <p><b>Получатель:</b> <span id="clientName">—</span></p>

    <p><b>Примерное время прибытия:</b><br>
    <span id="eta">Загрузка...</span></p>

    <p><b>Маршрут:</b><br>
    Откуда: <span id="fromCity">—</span><br>
    Куда: <span id="toCity">—</span></p>

    <p><b>Информация:</b><br>
    <span id="infoText">—</span></p>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script>
// ======== КАРТА (БЕЗ + / - И БЕЗ ЛИШНЕГО) ========
const map = L.map("map", {
  zoomControl: false,      // <-- убрали +/-
  attributionControl: false
}).setView([48.0196, 66.9237], 5);

// Нейтральная бесплатная карта (не украинская)
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
  { attribution: "Esri" }
).addTo(map);

// ======== ИКОНКА МАШИНЫ ========
const carIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/684/684908.png",
  iconSize: [40, 40],
  iconAnchor: [20, 20]
});

let carMarker = L.marker([0,0], { icon: carIcon });

// ======== ДАННЫЕ (ЗАМЕНИ НА СВОИ) ========
const clientData = {
  name: "Туман Туман",
  from: "Astana",
  to: "Airtam",
  info: "Инкассационная доставка",
  totalTimeMinutes: 238 // <-- сколько ехать всего (3ч 58м = 238 минут)
};

document.getElementById("clientName").innerText = clientData.name;
document.getElementById("fromCity").innerText = clientData.from;
document.getElementById("toCity").innerText = clientData.to;
document.getElementById("infoText").innerText = clientData.info;

// ======== ГЕОКОДИНГ (ищем города) ========
async function geocodeCity(city) {
  const url =
    "https://nominatim.openstreetmap.org/search?format=json&q=" +
    encodeURIComponent(city + ", Kazakhstan");

  const res = await fetch(url);
  const data = await res.json();

  if (!data || data.length === 0) {
    throw new Error("Город не найден: " + city);
  }

  return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
}

// ======== СТРОИМ МАРШРУТ И АНИМИРУЕМ МАШИНУ ========
async function buildRoute() {
  const fromCoords = await geocodeCity(clientData.from);
  const toCoords = await geocodeCity(clientData.to);

  const routeControl = L.Routing.control({
    waypoints: [
      L.latLng(fromCoords[0], fromCoords[1]),
      L.latLng(toCoords[0], toCoords[1])
    ],
    router: L.Routing.osrmv1({
      serviceUrl: "https://router.project-osrm.org/route/v1"
    }),
    addWaypoints: false,
    draggableWaypoints: false,
    fitSelectedRoutes: true
  }).addTo(map);

  routeControl.on("routesfound", function(e) {
    const route = e.routes[0];
    const coords = route.coordinates; // точки маршрута

    // Добавляем машину в начало маршрута
    carMarker.setLatLng(coords[0]);
    carMarker.addTo(map);

    // ======== АНИМАЦИЯ ПО ВРЕМЕНИ ========
    let startTime = Date.now();
    let totalMs = clientData.totalTimeMinutes * 60 * 1000;

    function animate() {
      let elapsed = Date.now() - startTime;
      let progress = elapsed / totalMs;

      if (progress > 1) progress = 1;

      let index = Math.floor(progress * (coords.length - 1));
      carMarker.setLatLng(coords[index]);

      // Таймер для клиента
      let remainingMs = totalMs - elapsed;
      if (remainingMs < 0) remainingMs = 0;

      let hours = Math.floor(remainingMs / 3600000);
      let minutes = Math.floor((remainingMs % 3600000) / 60000);
      let seconds = Math.floor((remainingMs % 60000) / 1000);

      document.getElementById("eta").innerText =
        hours + "ч " + minutes + "м " + seconds + "с";

      if (progress < 1) {
        requestAnimationFrame(animate);
      }
    }

    animate();
  });
}

// Запуск
buildRoute().catch(err => alert("Ошибка маршрута: " + err.message));
</script>

</body>
</html>
