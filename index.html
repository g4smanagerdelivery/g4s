<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>G4S Инкассационная доставка</title>

<!-- Leaflet (карта) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet Routing Machine (прокладка маршрута по дорогам) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyBQpb3mSpomljZihoyOlj77a8F99Tm9IFc",
  authDomain: "auction-top7.firebaseapp.com",
  projectId: "auction-top7",
  storageBucket: "auction-top7.firebasestorage.app",
  messagingSenderId: "73096110012",
  appId: "1:73096110012:web:8f014f6faae5d08bd455b9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== ГОРОДА → КООРДИНАТЫ =====
const CITY_COORDS = {
  "астана": [51.1605, 71.4704],
  "караганда": [49.8028, 73.0877],
  "алматы": [43.2220, 76.8512],
  "шымкент": [42.3417, 69.5901],
  "костанай": [53.2140, 63.6246],
  "актау": [43.6500, 51.2000]
};

// ===== ПАРАМЕТРЫ =====
const params = new URLSearchParams(location.search);
const userId = decodeURIComponent(params.get("user") || "");
const isAdminParam = params.get("admin") === "true";

const ADMIN_PASSWORD = "123456";
let isAdmin = false;
let endTime = null;
let startTime = null;
let routeCoords = []; // массив точек маршрута
let carMarker = null;
let map = null;
let routeLine = null;

if (isAdminParam) {
  const p = prompt("Пароль администратора");
  if (p === ADMIN_PASSWORD) isAdmin = true;
  else throw new Error("Access denied");
}

window.onload = () => {
  const admin = document.getElementById("admin");
  const view = document.getElementById("view");

  if (isAdmin) admin.style.display = "block";

  // ===== ИНИЦИАЛИЗАЦИЯ КАРТЫ (ВАЖНО — она теперь ВСЕГДА видна) =====
  map = L.map("map").setView([48.0196, 66.9237], 5);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18
  }).addTo(map);

  const carIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/2972/2972185.png",
    iconSize: [40, 40]
  });

  carMarker = L.marker([48.0196, 66.9237], { icon: carIcon }).addTo(map);

  if (userId) {
    const ref = doc(db, "investors", userId);

    onSnapshot(ref, async (snap) => {
      if (!snap.exists()) {
        view.innerHTML = "<h1>Данные не найдены</h1>";
        return;
      }

      const d = snap.data();
      endTime = new Date(d.endTime);
      startTime = new Date(endTime.getTime() - 3 * 60 * 60 * 1000); // 3 часа пути (условно)

      const from = (d.fromCity || "").toLowerCase();
      const to = (d.toCity || "").toLowerCase();

      const startCoords = CITY_COORDS[from] || [48.0196, 66.9237];
      const endCoords = CITY_COORDS[to] || [48.0196, 66.9237];

      // Очищаем старый маршрут
      if (routeLine) map.removeLayer(routeLine);

      // ===== СТРОИМ МАРШРУТ ПО ДОРОГАМ =====
      const router = L.Routing.osrmv1();

      router.route(
        [
          L.latLng(startCoords[0], startCoords[1]),
          L.latLng(endCoords[0], endCoords[1])
        ],
        (err, res) => {
          if (err) {
            console.error("Ошибка маршрута:", err);
            return;
          }

          routeCoords = res.routes[0].coordinates.map(c => [c.lat, c.lng]);

          routeLine = L.polyline(routeCoords, {
            color: "blue",
            weight: 4
          }).addTo(map);

          map.fitBounds(routeLine.getBounds());
        }
      );

      view.innerHTML = `
        <div class="card">
          <h1>ИНКАССАЦИОННАЯ ДОСТАВКА</h1>

          <h3>ФИО:</h3>
          <p class="fio">${d.name}</p>

          <h3>Примерное время прибытия:</h3>
          <p id="time" class="timer">--:--:--</p>

          <h3>Маршрут:</h3>
          <p><b>Откуда:</b> ${d.fromCity}</p>
          <p><b>Куда:</b> ${d.toCity}</p>

          <h3>Информация о доставке:</h3>
          <div class="info-box">${(d.info || "").replace(/\n/g, "<br>")}</div>
        </div>
      `;
    });
  }

  setInterval(updateTimerAndCar, 1000);
};

// ===== ТАЙМЕР + ДВИЖЕНИЕ ПО МАРШРУТУ =====
function updateTimerAndCar() {
  if (!endTime || routeCoords.length === 0) return;

  const now = new Date();
  const total = endTime - startTime;
  const passed = now - startTime;
  const progress = Math.min(1, Math.max(0, passed / total));

  // Таймер
  const diff = Math.max(0, endTime - now);
  const h = Math.floor(diff / 36e5);
  const m = Math.floor(diff % 36e5 / 6e4);
  const s = Math.floor(diff % 6e4 / 1000);

  const timeEl = document.getElementById("time");
  if (timeEl) {
    timeEl.textContent = `${h}ч ${m}м ${s}с`;
    timeEl.style.color = h < 1 ? "red" : "black";
  }

  // Двигаем машинку по реальному маршруту
  const index = Math.floor(progress * (routeCoords.length - 1));
  const pos = routeCoords[index];

  if (pos) {
    carMarker.setLatLng(pos);
  }
}

// ===== СОХРАНЕНИЕ ИЗ АДМИНКИ =====
window.saveUser = async () => {
  try {
    const id = uid.value.trim();
    const name = uname.value.trim();
    const t = endInput.value;
    const info = uinfo.value.trim();
    const fromCity = fromCityInput.value.trim();
    const toCity = toCityInput.value.trim();

    if (!id || !name || !t || !fromCity || !toCity) {
      alert("Заполни все поля");
      return;
    }

    await setDoc(doc(db, "investors", id), {
      name: name,
      endTime: new Date(t).toISOString(),
      info: info || "—",
      fromCity: fromCity,
      toCity: toCity
    });

    const link =
      "https://g4smanagerdelivery.github.io/g4s/?user=" +
      encodeURIComponent(id);

    await navigator.clipboard.writeText(link);

    alert("Сохранено!\nСсылка скопирована:\n\n" + link);

  } catch (err) {
    console.error("Ошибка сохранения:", err);
    alert("Ошибка — смотри F12 → Console");
  }
};
</script>

<style>
body {
  font-family: Arial;
  background-color: #f2f2f2;
  padding: 20px;
  text-align: center;
}

#map {
  height: 450px;      /* ВАЖНО — чтобы карта была видна */
  width: 100%;
  max-width: 1000px;
  margin: 20px auto;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.card {
  background: white;
  max-width: 700px;
  margin: auto;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

#admin {
  display: none;
  margin-top: 30px;
  background: white;
  padding: 20px;
  border-radius: 8px;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}

#admin input, #admin textarea {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
}
</style>
</head>

<body>

<div id="view">
  <h1>Загрузка…</h1>
</div>

<div id="map"></div>

<div id="admin">
  <h2>Админ-панель</h2>

  <input id="uid" placeholder="ID (например: Tuman)">
  <input id="uname" placeholder="ФИО">
  <input type="datetime-local" id="endInput">

  <input id="fromCityInput" placeholder="Откуда (город)">
  <input id="toCityInput" placeholder="Куда (город)">

  <textarea id="uinfo" rows="5" placeholder="Информация о доставке"></textarea>

  <button onclick="saveUser()">Сохранить</button>
</div>

</body>
</html>
