<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>G4S Инкассационная доставка</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQpb3mSpomljZihoyOlj77a8F99Tm9IFc",
  authDomain: "auction-top7.firebaseapp.com",
  projectId: "auction-top7",
  storageBucket: "auction-top7.firebasestorage.app",
  messagingSenderId: "73096110012",
  appId: "1:73096110012:web:8f014f6faae5d08bd455b9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const userId = decodeURIComponent(params.get("user") || "");
const isAdminParam = params.get("admin") === "true";

const ADMIN_PASSWORD = "123456";
let isAdmin = false;
let endTime = null;
let map, marker, routeLine;
let route = [];

// ======== ГЕОКОДИНГ ГОРОДА (БЕЗ КООРДИНАТ ВВОДА) ========
async function geocodeCity(city) {
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`;

  const res = await fetch(url, {
    headers: { "Accept-Language": "ru" }
  });

  const data = await res.json();
  if (!data || data.length === 0) return null;

  return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
}

// ======== ПРОВЕРКА АДМИН-ПАРОЛЯ ========
if (isAdminParam) {
  const p = prompt("Пароль администратора");
  if (p === ADMIN_PASSWORD) isAdmin = true;
  else throw new Error("Access denied");
}

window.onload = () => {
  const admin = document.getElementById("admin");
  const view = document.getElementById("view");

  if (isAdmin) admin.style.display = "block";

  // Карта по умолчанию — Казахстан
  map = L.map("map").setView([48.0196, 66.9237], 5);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  marker = L.circleMarker([48.0196, 66.9237], {
    radius: 8
  }).addTo(map);

  if (userId) {
    const ref = doc(db, "investors", userId);

    onSnapshot(ref, (snap) => {
      if (!snap.exists()) {
        view.innerHTML = "<h1>Данные не найдены</h1>";
        return;
      }

      const d = snap.data();
      endTime = new Date(d.endTime);
      route = d.route || [];

      if (route.length >= 2) {
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(route).addTo(map);
        marker.setLatLng(route[0]);
        map.fitBounds(routeLine.getBounds());
      }

      view.innerHTML = `
        <div class="card">
          <h1>ИНКАССАЦИОННАЯ ДОСТАВКА</h1>

          <h3>ФИО:</h3>
          <p class="fio">${d.name}</p>

          <h3>Откуда:</h3>
          <p>${d.fromCity}</p>

          <h3>Куда:</h3>
          <p>${d.toCity}</p>

          <h3>Примерное время прибытия:</h3>
          <p id="time" class="timer">--:--:--</p>

          <h3>Информация о доставке:</h3>
          <div class="info-box">${(d.info || "").replace(/\n/g, "<br>")}</div>

          <div id="map" style="height: 400px; margin-top: 20px;"></div>
        </div>
      `;
    });
  }

  setInterval(() => {
    updateTimer();
    updateMapPosition();
  }, 1000);
};

function updateTimer() {
  if (!endTime) return;
  const diff = Math.max(0, endTime - new Date());
  const h = Math.floor(diff / 36e5);
  const m = Math.floor(diff % 36e5 / 6e4);
  const s = Math.floor(diff % 6e4 / 1000);

  const timeEl = document.getElementById("time");
  if (timeEl) {
    timeEl.textContent = `${h}ч ${m}м ${s}с`;
  }
}

function updateMapPosition() {
  if (!endTime || route.length < 2) return;

  const totalTime = 60 * 60 * 1000; // 1 час на маршрут
  const elapsed = totalTime - Math.max(0, endTime - new Date());
  const progress = Math.min(1, elapsed / totalTime);

  const index = Math.floor(progress * (route.length - 1));
  marker.setLatLng(route[index]);
}

// ======== СОХРАНЕНИЕ ДАННЫХ (ВАЖНО — ИСПРАВЛЕНО) ========
window.saveUser = async () => {
  const id = uid.value.trim();
  const name = uname.value.trim();
  const t = endInput.value;
  const info = uinfo.value.trim();
  const fromCity = fromCityInput.value.trim();
  const toCity = toCityInput.value.trim();

  if (!id || !name || !t || !fromCity || !toCity) {
    alert("Заполни ID, ФИО, время, Откуда и Куда (города)");
    return;
  }

  const fromCoords = await geocodeCity(fromCity);
  const toCoords = await geocodeCity(toCity);

  if (!fromCoords) {
    alert("Не смог найти город: " + fromCity);
    return;
  }
  if (!toCoords) {
    alert("Не смог найти город: " + toCity);
    return;
  }

  const route = [fromCoords, toCoords];

  await setDoc(doc(db, "investors", id), {
    name: name,
    endTime: new Date(t).toISOString(),
    info: info || "—",
    fromCity: fromCity,
    toCity: toCity,
    route: route
  });

  // ✅ ПРАВИЛЬНАЯ ССЫЛКА (БЕЗ 404)
  const base = "https://g4smanagerdelivery.github.io/g4s/";
  const link = base + "?user=" + encodeURIComponent(id);

  await navigator.clipboard.writeText(link);

  alert("Сохранено ✅\nСсылка скопирована:\n\n" + link);
};
</script>

<style>
body {
  font-family: Arial;
  background-color: #f2f2f2;
  padding: 30px;
  text-align: center;
}

.card {
  background: white;
  max-width: 800px;
  margin: auto;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.fio {
  font-size: 22px;
  font-weight: bold;
}

.timer {
  font-size: 24px;
  font-weight: bold;
}

.info-box {
  background: #f3f3f3;
  padding: 15px;
  border-radius: 8px;
  margin: 10px 0;
  text-align: left;
}

#admin {
  display: none;
  margin-top: 30px;
  background: white;
  padding: 20px;
  border-radius: 8px;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}

#admin input, #admin textarea {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
}
</style>
</head>

<body>

<div id="view">
  <h1>Загрузка…</h1>
</div>

<div id="admin">
  <h2>Админ-панель</h2>

  <input id="uid" placeholder="ID (например: tuman)">
  <input id="uname" placeholder="ФИО">
  <input type="datetime-local" id="endInput">

  <input id="fromCityInput" placeholder="Откуда (например: Алматы)">
  <input id="toCityInput" placeholder="Куда (например: Астана)">

  <textarea id="uinfo" rows="5" placeholder="Информация о доставке"></textarea>
  <button onclick="saveUser()">Сохранить</button>
</div>

<div id="map" style="height: 450px; margin-top: 20px;"></div>

</body>
</html>
