<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>G4S Инкассационная доставка</title>

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Routing Machine -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQpb3mSpomljZihoyOlj77a8F99Tm9IFc",
  authDomain: "auction-top7.firebaseapp.com",
  projectId: "auction-top7",
  storageBucket: "auction-top7.firebasestorage.app",
  messagingSenderId: "73096110012",
  appId: "1:73096110012:web:8f014f6faae5d08bd455b9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const userId = decodeURIComponent(params.get("user") || "");
const isAdminParam = params.get("admin") === "true";

const ADMIN_PASSWORD = "123456";
let isAdmin = false;
let endTime = null;
let routeControl = null;
let routeCoords = [];
let carMarker = null;

if (isAdminParam) {
  const p = prompt("Пароль администратора");
  if (p === ADMIN_PASSWORD) isAdmin = true;
  else throw new Error("Access denied");
}

window.onload = () => {
  document.getElementById("admin").style.display = isAdmin ? "block" : "none";

  // Карта (нейтральная, без флагов)
  const map = L.map("map").setView([48.0196, 66.9237], 5);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: "© OpenStreetMap, © Carto"
  }).addTo(map);

  const carIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/744/744465.png",
    iconSize: [32, 32]
  });

  if (userId) {
    const ref = doc(db, "investors", userId);

    onSnapshot(ref, async (snap) => {
      if (!snap.exists()) {
        document.getElementById("view").innerHTML = "<h1>Данные не найдены</h1>";
        return;
      }

      const d = snap.data();
      endTime = new Date(d.endTime);

      document.getElementById("view").innerHTML = `
        <div class="card">
          <h1>ИНКАССАЦИОННАЯ ДОСТАВКА</h1>
          <h3>Получатель:</h3>
          <p class="fio">${d.name}</p>

          <h3>Примерное время прибытия:</h3>
          <p id="time" class="timer">--:--:--</p>

          <h3>Маршрут:</h3>
          <p><b>Откуда:</b> ${d.from}</p>
          <p><b>Куда:</b> ${d.to}</p>

          <h3>Информация:</h3>
          <div class="info-box">${(d.info || "").replace(/\n/g, "<br>")}</div>
        </div>
      `;

      // Получаем координаты БЕЗ CORS (Photon — работает у клиента)
      const fromCoords = await geocodeCity(d.from);
      const toCoords = await geocodeCity(d.to);

      if (!fromCoords || !toCoords) {
        alert("Ошибка маршрута — проверь названия городов");
        return;
      }

      if (routeControl) map.removeControl(routeControl);

      routeControl = L.Routing.control({
        waypoints: [
          L.latLng(fromCoords.lat, fromCoords.lng),
          L.latLng(toCoords.lat, toCoords.lng)
        ],
        lineOptions: {
          styles: [{ color: "black", weight: 4 }]
        },
        createMarker: () => null
      }).addTo(map);

      routeControl.on("routesfound", function(e) {
        routeCoords = e.routes[0].coordinates;
        map.fitBounds(L.latLngBounds(routeCoords));

        if (carMarker) map.removeLayer(carMarker);
        carMarker = L.marker(routeCoords[0], { icon: carIcon }).addTo(map);
      });
    });
  }

  setInterval(() => {
    updateTimer();
    moveCarByTime();
  }, 1000);
};

async function geocodeCity(city) {
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(city + ", Kazakhstan")}`;
  const r = await fetch(url);
  const j = await r.json();
  if (!j.features || j.features.length === 0) return null;

  return {
    lng: j.features[0].geometry.coordinates[0],
    lat: j.features[0].geometry.coordinates[1]
  };
}

function updateTimer() {
  if (!endTime) return;
  const diff = Math.max(0, endTime - new Date());
  const h = Math.floor(diff / 36e5);
  const m = Math.floor(diff % 36e5 / 6e4);
  const s = Math.floor(diff % 6e4 / 1000);

  const el = document.getElementById("time");
  if (el) el.textContent = `${h}ч ${m}м ${s}с`;
}

function moveCarByTime() {
  if (!carMarker || !routeCoords || !endTime) return;

  const total = endTime - Date.now() + (routeCoords.length * 1000);
  const passed = Math.max(0, total);
  const progress = 1 - passed / (routeCoords.length * 1000);

  const idx = Math.min(
    routeCoords.length - 1,
    Math.floor(progress * routeCoords.length)
  );

  carMarker.setLatLng(routeCoords[idx]);
}

window.saveUser = async () => {
  const id = uid.value.trim();
  const name = uname.value.trim();
  const t = endInput.value;
  const from = ufrom.value.trim();
  const to = uto.value.trim();
  const info = uinfo.value;

  if (!id || !name || !t || !from || !to) {
    alert("Заполни все поля!");
    return;
  }

  document.getElementById("status").innerText = "Сохраняю… ⏳";

  await setDoc(doc(db, "investors", id), {
    name,
    endTime: new Date(t).toISOString(),
    from,
    to,
    info: info || "—"
  });

  const link = location.origin + location.pathname + "?user=" + encodeURIComponent(id);
  await navigator.clipboard.writeText(link);

  document.getElementById("status").innerHTML =
    `Готово ✅<br>Ссылка скопирована:<br><b>${link}</b>`;
};
</script>

<style>
body {
  font-family: Arial;
  margin: 0;
  display: flex;
}

#left {
  width: 40%;
  padding: 20px;
  background: #f2f2f2;
  overflow-y: auto;
}

#map {
  width: 60%;
  height: 100vh;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

#admin {
  display: none;
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 8px;
}

input, textarea {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
}
</style>
</head>

<body>
<div id="left">
  <div id="view"><h1>Загрузка…</h1></div>

  <div id="admin">
    <h2>Админ-панель</h2>
    <input id="uid" placeholder="ID (например: Tuman)">
    <input id="uname" placeholder="ФИО">
    <input type="datetime-local" id="endInput">
    <input id="ufrom" placeholder="Откуда (город)">
    <input id="uto" placeholder="Куда (город)">
    <textarea id="uinfo" rows="5" placeholder="Информация о доставке"></textarea>
    <button onclick="saveUser()">Сохранить</button>
    <p id="status" style="color:green"></p>
  </div>
</div>

<div id="map"></div>
</body>
</html>
