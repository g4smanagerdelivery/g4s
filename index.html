<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>G4S Инкассационная доставка</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyBQpb3mSpomljZihoyOlj77a8F99Tm9IFc",
  authDomain: "auction-top7.firebaseapp.com",
  projectId: "auction-top7",
  storageBucket: "auction-top7.firebasestorage.app",
  messagingSenderId: "73096110012",
  appId: "1:73096110012:web:8f014f6faae5d08bd455b9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const userId = decodeURIComponent(params.get("user") || "");
const isAdminParam = params.get("admin") === "true";

const ADMIN_PASSWORD = "123456";
let isAdmin = false;

// ===== КАРТА И МАШИНА =====
let map, carMarker, routeLine;
let routePoints = [];
let endTime = null;
let totalDurationMs = 0; // сколько изначально было времени

if (isAdminParam) {
  const p = prompt("Пароль администратора");
  if (p === ADMIN_PASSWORD) isAdmin = true;
  else throw new Error("Access denied");
}

window.onload = () => {
  if (isAdmin) document.getElementById("admin").style.display = "block";

  initMap();

  if (userId) {
    const ref = doc(db, "investors", userId);

    onSnapshot(ref, async (snap) => {
      if (!snap.exists()) {
        document.getElementById("fio").textContent = "Данные не найдены";
        return;
      }

      const d = snap.data();
      endTime = new Date(d.endTime);

      // Запоминаем, сколько времени было изначально
      totalDurationMs = Math.max(1000, endTime - new Date());

      document.getElementById("fio").textContent = d.name;
      document.getElementById("fromCity").textContent = d.fromCity;
      document.getElementById("toCity").textContent = d.toCity;
      document.getElementById("infoBox").innerHTML =
        (d.info || "").replace(/\n/g, "<br>");

      await buildRoute(d.fromCity, d.toCity);
    });
  }

  setInterval(updateTimerAndCar, 1000);
};

function updateTimerAndCar() {
  if (!endTime || routePoints.length === 0) return;

  const now = new Date();
  let diff = Math.max(0, endTime - now);

  const h = Math.floor(diff / 36e5);
  const m = Math.floor(diff % 36e5 / 6e4);
  const s = Math.floor(diff % 6e4 / 1000);

  document.getElementById("time").textContent =
    `${h}ч ${m}м ${s}с`;

  // ===== ДВИЖЕНИЕ МАШИНЫ ПО ТАЙМЕРУ =====
  const passed = totalDurationMs - diff; // сколько времени прошло
  const progress = Math.min(1, passed / totalDurationMs); // от 0 до 1

  const index = Math.floor(progress * (routePoints.length - 1));
  carMarker.setLatLng(routePoints[index]);
}

// ===== ИНИЦИАЛИЗАЦИЯ КАРТЫ =====
function initMap() {
  map = L.map("map").setView([48.0196, 66.9237], 6);

  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
    { attribution: "Esri" }
  ).addTo(map);

  const carIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/744/744465.png",
    iconSize: [40, 40]
  });

  carMarker = L.marker([0, 0], { icon: carIcon }).addTo(map);
}

// ===== ГЕОКОДИНГ (БЕЗ CORS-ОШИБОК) =====
async function geocodeCity(city) {
  const url =
    "https://geocode.maps.co/search?q=" +
    encodeURIComponent(city + ", Kazakhstan");

  const res = await fetch(url);
  const data = await res.json();

  if (!data || data.length === 0) {
    throw new Error("Город не найден: " + city);
  }

  return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
}

// ===== СТРОИМ МАРШРУТ =====
async function buildRoute(fromCity, toCity) {
  try {
    const from = await geocodeCity(fromCity);
    const to = await geocodeCity(toCity);

    if (routeLine) map.removeLayer(routeLine);

    const distanceKm = map.distance(
      L.latLng(from[0], from[1]),
      L.latLng(to[0], to[1])
    ) / 1000;

    const steps = Math.max(100, Math.round(distanceKm * 20)); // больше точек = плавнее

    routePoints = [];

    for (let i = 0; i <= steps; i++) {
      const lat = from[0] + (to[0] - from[0]) * (i / steps);
      const lng = from[1] + (to[1] - from[1]) * (i / steps);
      routePoints.push([lat, lng]);
    }

    routeLine = L.polyline(routePoints, {
      color: "#007bff",
      weight: 5
    }).addTo(map);

    map.fitBounds(routeLine.getBounds());
    carMarker.setLatLng(routePoints[0]);
  } catch (e) {
    console.error(e);
    alert("Ошибка маршрута — проверь названия городов.");
  }
}

// ===== СОХРАНЕНИЕ ИЗ АДМИНКИ =====
window.saveUser = async () => {
  try {
    const id = uid.value.trim();
    const name = uname.value.trim();
    const t = endInput.value;
    const info = uinfo.value.trim();
    const fromCity = fromCityInput.value.trim();
    const toCity = toCityInput.value.trim();

    if (!id || !name || !t || !fromCity || !toCity) {
      alert("Заполни все поля!");
      return;
    }

    await setDoc(doc(db, "investors", id), {
      name,
      endTime: new Date(t).toISOString(),
      info: info || "—",
      fromCity,
      toCity
    });

    const link =
      "https://g4smanagerdelivery.github.io/g4s/?user=" +
      encodeURIComponent(id);

    await navigator.clipboard.writeText(link);

    alert("Сохранено ✅\nСсылка скопирована:\n\n" + link);
  } catch (err) {
    console.error(err);
    alert("Ошибка — смотри F12 → Console");
  }
};
</script>

<style>
body { margin: 0; font-family: Arial; }

.container {
  display: flex;
  height: 100vh;
}

#panel {
  width: 40%;
  padding: 20px;
  background: #f2f2f2;
  overflow-y: auto;
}

#map {
  width: 60%;
  height: 100vh;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
}

#admin { display: none; margin-top: 20px; }
</style>
</head>

<body>

<div class="container">

  <div id="panel">
    <div class="card">
      <h1>ИНКАССАЦИОННАЯ ДОСТАВКА</h1>

      <h3>Получатель:</h3>
      <p id="fio">Загрузка…</p>

      <h3>Примерное время прибытия:</h3>
      <p id="time">--:--:--</p>

      <h3>Маршрут:</h3>
      <p><b>Откуда:</b> <span id="fromCity"></span></p>
      <p><b>Куда:</b> <span id="toCity"></span></p>

      <h3>Информация:</h3>
      <div id="infoBox"></div>
    </div>

    <div id="admin">
      <h2>Админ-панель</h2>

      <input id="uid" placeholder="ID (например: Tuman)">
      <input id="uname" placeholder="ФИО">
      <input type="datetime-local" id="endInput">

      <input id="fromCityInput" placeholder="Откуда (город)">
      <input id="toCityInput" placeholder="Куда (город)">

      <textarea id="uinfo" rows="5" placeholder="Информация"></textarea>

      <button onclick="saveUser()">Сохранить</button>
    </div>
  </div>

  <div id="map"></div>

</div>

</body>
</html>
